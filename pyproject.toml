[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "0.1.0"
description = "Drishti: Intelligent MLOps monitoring, RCA, MLflow registry, and GenAI Copilot"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Drishti Team", email = "i.m.paarthgupta@gmail.com"}
]
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "networkx>=3.1",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "streamlit>=1.34",
  "plotly>=5.20",
  "pyvis>=0.3",
  "evidently>=0.4.29",
  "requests>=2.31",
  "httpx>=0.27",
  "tenacity>=8.2",
  "PyYAML>=6.0",
  "prometheus-client>=0.19",
  "mlflow>=2.14",
  "scikit-learn>=1.4",
  "langchain>=0.3",
  "langchain-google-genai>=2.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
tests = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "pmdarima>=2.0",
  "statsforecast>=1.5",
]
lint = [
  "ruff>=0.4",
  "black>=24.4",
  "isort>=5.13",
  "mypy>=1.10",
  "types-requests",
  "types-python-dateutil",
  "types-PyYAML",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.4",
  "isort>=5.13",
  "mypy>=1.10",
  "types-requests",
  "types-python-dateutil",
  "types-PyYAML",
  "pmdarima>=2.0",
  "statsforecast>=1.5",
]
forecast = [
  "pmdarima>=2.0",
  "statsforecast>=1.5",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
include = ["app*"]
